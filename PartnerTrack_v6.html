<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#eef2f7;color:#1a1a2e;min-height:100vh;font-size:13px}
:root{--hdr:#4a7ec7;--border:#dde3ec;--muted:#7a8499;--sf:#f4f6fb}
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--hdr);padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar h1{font-size:17px;font-weight:700;color:#fff}
.topbar-r{display:flex;align-items:center;gap:10px}
.ubtn{background:#ffffff33;color:#fff;border:none;padding:5px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.ubtn:hover{background:#ffffff44}
.nav-tabs{display:flex;background:#3a6ab0;flex-wrap:wrap}
.ntab{padding:10px 18px;font-size:12px;color:#c8d9f5;cursor:pointer;border-bottom:3px solid transparent;font-weight:500;border:none;background:none}
.ntab:hover{color:#fff;background:#4578c4}
.ntab.act{color:#fff;border-bottom:3px solid #fff;background:#4578c4}
.content{flex:1;padding:20px;overflow-y:auto}
.pg{display:none}.pg.act{display:block}
/* KPI */
.krow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:20px}
.kcard{border-radius:10px;padding:14px 16px;color:#fff}
.kc-b{background:#4a7ec7}.kc-r{background:#e74c3c}.kc-y{background:#e6a817}.kc-g{background:#3aaa5e}.kc-p{background:#c0392b}
.klbl{font-size:11px;font-weight:700;opacity:.9;text-transform:uppercase;letter-spacing:.5px}
.knum{font-size:30px;font-weight:800;line-height:1.1}
.ksub{font-size:10px;opacity:.8;margin-top:2px}
/* cards */
.card{background:#fff;border-radius:10px;border:1px solid var(--border);padding:16px;margin-bottom:14px}
.ctitle{font-size:14px;font-weight:700;color:#1a1a2e;margin-bottom:12px}
/* table */
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:8px 10px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);background:#f4f6fb;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #f0f3f8;color:#2d3748;vertical-align:middle}
tr:hover td{background:#fafbfe}
.tscroll{overflow-x:auto}
/* pills */
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}
.p-red{background:#e74c3c;color:#fff}.p-yellow{background:#e6a817;color:#fff}.p-green{background:#3aaa5e;color:#fff}
.p-od{background:#fdecea;color:#c0392b;border:1px solid #f5b7b1}
.p-ds{background:#fef6e4;color:#b8860b;border:1px solid #f5d47a}
.p-done{background:#eafaf1;color:#1e8449;border:1px solid #a9dfbf}
.oday{background:#fdecea;color:#c0392b;padding:2px 7px;border-radius:5px;font-weight:700;font-size:11px}
/* section headers */
.sh{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:6px;font-size:13px;font-weight:700;margin-bottom:14px}
.sh-ov{background:#e8f0fb;color:#1a5276}
.sh-am{background:#bdd7f5;color:#0a3d6b}
.sh-tr{background:#d4f5e2;color:#145a32}
/* od display */
.od-disp{background:#fff3cd;border:1px solid #ffc107;border-radius:6px;padding:7px 12px;font-size:12px;font-weight:600;color:#856404}
/* read-only display box */
.ro-box{background:#f4f6fb;border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:12px;color:#4a5568;min-height:36px}
/* forms */
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.fg4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
.fl{font-size:11px;font-weight:700;color:#4a5568}
.full{grid-column:1/-1}
select,input[type=text],input[type=email],input[type=password],input[type=date],textarea{padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;color:#1a1a2e;background:#fff;outline:none;transition:border .15s;width:100%}
input[type=date]{cursor:pointer}
select:focus,input:focus,textarea:focus{border-color:#4a7ec7;box-shadow:0 0 0 2px #4a7ec720}
textarea{resize:vertical;min-height:65px}
/* buttons */
.abtn{padding:8px 18px;border-radius:7px;border:none;font-size:12px;font-weight:700;cursor:pointer}
.abtn-blue{background:#4a7ec7;color:#fff}.abtn-blue:hover{background:#3a6ab0}
.abtn-orange{background:#e8841a;color:#fff}
.abtn-green{background:#3aaa5e;color:#fff}
.abtn-sm{padding:4px 10px;font-size:11px;font-weight:600;border-radius:6px;border:none;cursor:pointer}
.btn-blue{background:#4a7ec7;color:#fff}.btn-red{background:#e74c3c;color:#fff}.btn-yel{background:#e6a817;color:#fff}.btn-grn{background:#3aaa5e;color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}.btn-ghost:hover{background:#f4f6fb}
/* connect stage pills */
.csp{padding:5px 14px;border:1px solid var(--border);border-radius:20px;cursor:pointer;font-size:11px;font-weight:600;color:var(--muted);background:#fff}
.csp:hover{border-color:#4a7ec7;color:#4a7ec7}
.csp.sel{background:#4a7ec7;color:#fff;border-color:#4a7ec7}
/* dtag */
.dtag{display:inline-flex;align-items:center;gap:4px;background:#e8f0fb;color:#1a5276;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:500;margin:2px}
.dtag-x{background:none;border:none;cursor:pointer;color:#c0392b;font-weight:700;font-size:13px;line-height:1;padding:0 1px}
/* account card for partner */
.acc-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;cursor:pointer;transition:all .15s}
.acc-card:hover{border-color:#4a7ec7;background:#f8fbff}
.acc-card.selected{border:2px solid #4a7ec7;background:#f0f7ff}
/* auth */
.abg{min-height:100vh;background:#3a6ab0;display:flex;align-items:center;justify-content:center}
.ac{background:#fff;border-radius:14px;padding:32px;width:390px;max-width:96vw}
.alogo h2{font-size:20px;font-weight:800;color:#4a7ec7;text-align:center;margin-bottom:4px}
.alogo p{font-size:11px;color:var(--muted);text-align:center;margin-bottom:22px}
.atabs{display:flex;border-bottom:2px solid #e2e8f0;margin-bottom:18px}
.atab{padding:7px 16px;font-size:12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;background:none;border-top:none;border-left:none;border-right:none;font-weight:500}
.atab.act{color:#4a7ec7;border-bottom-color:#4a7ec7;font-weight:700}
.steps{display:flex;gap:5px;margin-bottom:18px}
.step{flex:1;height:3px;border-radius:2px}
.alert{padding:9px 12px;border-radius:6px;font-size:12px;margin-bottom:12px}
.as{background:#eafaf1;color:#1e8449;border:1px solid #a9dfbf}
.ae{background:#fdecea;color:#c0392b;border:1px solid #f5b7b1}
.ai{background:#e8f0fb;color:#1a5276;border:1px solid #b5d4f4}
.blk{background:none;border:none;color:#4a7ec7;cursor:pointer;font-size:12px;padding:0;text-decoration:underline}
.infob{background:#e8f0fb;border:1px solid #b5d4f4;border-radius:6px;padding:9px 12px;font-size:11px;color:#1a5276;margin-bottom:12px}
.rtok{background:#1a1a2e;color:#3aaa5e;font-family:monospace;padding:9px;border-radius:6px;font-size:15px;margin:8px 0;text-align:center;letter-spacing:3px}
.prow{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #f5d47a;background:#fffbf0;border-radius:8px;margin-bottom:8px}
.av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0}
.ava{background:#fdecea;color:#c0392b}.avp{background:#eafaf1;color:#1e8449}.avs{background:#f3e5f5;color:#7b1fa2}
/* modal */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:300;padding:16px}
.mc{background:#fff;border-radius:12px;padding:22px;width:540px;max-width:100%;max-height:90vh;overflow-y:auto}
.mt{font-size:15px;font-weight:700;margin-bottom:14px;color:#1a1a2e}
.ma{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid #f0f3f8}
/* filters */
.tf{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:#fff;padding:10px 14px;border-radius:10px;border:1px solid var(--border);margin-bottom:16px}
.tf-g{display:flex;flex-direction:column;gap:3px}
.tf-l{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.tf-s{padding:5px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:#fff;color:#1a1a2e;outline:none;min-width:110px}
.tf-s:focus{border-color:#4a7ec7}
.spill{padding:5px 14px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;border:2px solid transparent}
.sp-r{background:#fdecea;color:#c0392b;border-color:#f5b7b1}.sp-r.on{background:#e74c3c;color:#fff;border-color:#e74c3c}
.sp-y{background:#fef6e4;color:#b8860b;border-color:#f5d47a}.sp-y.on{background:#e6a817;color:#fff;border-color:#e6a817}
.sp-g{background:#eafaf1;color:#1e8449;border-color:#a9dfbf}.sp-g.on{background:#3aaa5e;color:#fff;border-color:#3aaa5e}
.pag{display:flex;align-items:center;gap:5px;margin-top:10px;justify-content:flex-end}
.pb{padding:4px 9px;border:1px solid var(--border);border-radius:5px;background:#fff;cursor:pointer;color:#4a7ec7;font-size:11px}
.pb:hover{background:#e8f0fb}.pb.cur{background:#4a7ec7;color:#fff}
.rcheck{display:flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:12px}
.rcheck:hover{background:#f4f6fb;border-color:#4a7ec7}
.rcheck.on{background:#e8f0fb;border-color:#4a7ec7;color:#1a5276}
.rcheck input[type=checkbox]{width:14px;height:14px;cursor:pointer;accent-color:#4a7ec7}
.rp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}
.nfbtn{background:#4a7ec7;color:#fff;border:none;padding:7px 16px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer}
.nfbtn:hover{background:#3a6ab0}
.dots{cursor:pointer;color:var(--muted);font-weight:700;font-size:16px;padding:0 4px}
/* divider label */
.divlbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:4px 0;border-bottom:1px solid var(--border);margin-bottom:12px}
/* banner */
.banner{border-radius:8px;padding:10px 14px;font-size:12px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.banner-blue{background:#e8f0fb;border:1px solid #b5d4f4;color:#1a5276}
.banner-green{background:#eafaf1;border:1px solid #a9dfbf;color:#145a32}
</style>
</head>

/* ===== ENRICHED DATA HELPERS ===== */
function enrichedAccounts(){
  return S.accounts.map(a=>{
    const am=getAM(a.id);
    const partner=gu(a.assignedPartnerId);
    const stage=gs(a.stageId);
    const amOD=am?odD(am.nextConnectDateDM):0;
    const trOD=odD(a.trials.connectDate);
    return{...a,am,partnerName:partner.name,stageName:stage.name,amOD,trOD};
  });
}
function filteredAccounts(){
  let rows=isA()?enrichedAccounts():enrichedAccounts().filter(a=>a.assignedPartnerId===CU.id);
  if(FILTERS.status)rows=rows.filter(a=>a.overallStatus===FILTERS.status);
  if(FILTERS.partner)rows=rows.filter(a=>a.assignedPartnerId===FILTERS.partner);
  if(FILTERS.stage)rows=rows.filter(a=>a.stageId===FILTERS.stage);
  if(SEARCH)rows=rows.filter(a=>a.companyName.toLowerCase().includes(SEARCH.toLowerCase())||a.accountGroup.toLowerCase().includes(SEARCH.toLowerCase())||a.partnerName.toLowerCase().includes(SEARCH.toLowerCase()));
  const act=Object.values(SF).some(Boolean);
  if(act)rows=rows.filter(a=>{const od=a.amOD>0;const ds=!od&&a.am?.nextConnectDateDM&&(new Date(a.am.nextConnectDateDM)-new Date(today()))/86400000<=3;const cp=a.overallStatus==='green';return(SF.red&&od)||(SF.yellow&&ds)||(SF.green&&cp);});
  if(ASGN&&ASGN!=='all')rows=rows.filter(a=>a.assignedPartnerId===ASGN);
  return rows;
}

function dlCSV(){const sel=COLS.filter(c=>RPTP[c.k]);const hdr=sel.map(c=>c.l).join(',');const rows=enrichedAccounts().map(a=>{const v=getRV(a);return sel.map(c=>`"${(v[c.k]??'').toString().replace(/"/g,'""')}"`).join(',');});const csv=[hdr,...rows].join('\n');const a2=document.createElement('a');a2.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a2.download=`PartnerTrack_${today()}.csv`;a2.click();sal('Report downloaded!','as');}
function dlAudit(){const hdr='Timestamp,User,Role,Action,Record,Field,Old,New';const rows=S.auditLog.map(l=>[l.ts,l.user,l.role,l.action,l.record,l.field,l.oldv,l.newv].map(v=>`"${v}"`).join(','));const csv=[hdr,...rows].join('\n');const a2=document.createElement('a');a2.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a2.download=`AuditLog_${today()}.csv`;a2.click();sal('Audit log downloaded!','as');}

        <button class="abtn-sm btn-yel" onclick="openM('reset-pw','${p.id}')">Reset PW</button>
        <button class="abtn-sm btn-red" onclick="delPartner('${p.id}')">Remove</button>
      </div></td>
    </tr>`;}).join('')}</tbody></table>
  </div>
  ${CU.role==='superadmin'?`<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div class="ctitle" style="margin-bottom:0">Admin Accounts (${admins.length})</div>
      <button class="nfbtn" onclick="openM('add-admin')">+ Add Admin</button>
    </div>
    <table><thead><tr><th>Name</th><th>Email</th><th>Actions</th></tr></thead>
    <tbody>${admins.map(a=>`<tr>
      <td><div style="display:flex;align-items:center;gap:7px"><div class="av ava" style="width:28px;height:28px;font-size:10px">${a.name.split(' ').map(w=>w[0]).join('').slice(0,2)}</div><strong>${a.name}</strong></div></td>
      <td style="color:var(--muted);font-size:11px">${a.email}</td>
      <td><div style="display:flex;gap:5px">
        <button class="abtn-sm btn-ghost" onclick="openM('edit-admin','${a.id}')">Edit</button>

      </div></td>

</div>
<div>

</div>
</div>`;}

/* ===== MODALS ===== */
function mH(){
  if(!MODAL)return'';
  const{type,id}=MODAL;let c='';
  const mfi=(l,iid,v='',t='text')=>`<div class="fg"><label class="fl">${l}</label><input type="${t}" id="${iid}" value="${v}"></div>`;
  if(type==='add-partner'||type==='edit-partner'){const p=id?S.users.find(x=>x.id===id):null;c=`<div class="mt">${id?'Edit Partner':'Add Partner'}</div>${mfi('Full Name *','mn',p?.name||'')}${mfi('Email *','me',p?.email||'','email')}${!id?mfi('Password *','mp','','password'):''}<div class="ma"><button class="abtn-sm btn-ghost" onclick="closeM()">Cancel</button><button class="abtn abtn-blue" style="padding:7px 18px" onclick="savePartner('${id||''}')">Save</button></div>`;}
  else if(type==='add-admin'||type==='edit-admin'){const a=id?S.users.find(x=>x.id===id):null;c=`<div class="mt">${id?'Edit Admin':'Add Admin'}</div>${mfi('Full Name *','mn',a?.name||'')}${mfi('Email *','me',a?.email||'','email')}${!id?mfi('Password *','mp','','password'):''}<div class="ma"><button class="abtn-sm btn-ghost" onclick="closeM()">Cancel</button><button class="abtn abtn-blue" style="padding:7px 18px" onclick="saveAdmin('${id||''}')">Save</button></div>`;}
  else if(type==='add-stage'||type==='edit-stage'){const s=id?S.stages.find(x=>x.id===id):null;c=`<div class="mt">${id?'Edit Stage':'Add Stage'}</div>${mfi('Stage Name *','mn',s?.name||'')}<div class="ma"><button class="abtn-sm btn-ghost" onclick="closeM()">Cancel</button><button class="abtn abtn-blue" style="padding:7px 18px" onclick="saveStage('${id||''}')">Save</button></div>`;}
  else if(type==='reset-pw'){const u=S.users.find(x=>x.id===id);c=`<div class="mt">Reset Password — ${u?.name||''}</div><div class="infob">Set a temporary password for this user.</div>${mfi('New Password *','mnp','','password')}${mfi('Confirm *','mcp','','password')}<div class="ma"><button class="abtn-sm btn-ghost" onclick="closeM()">Cancel</button><button class="abtn-sm btn-yel" style="padding:5px 14px" onclick="adminRPw('${id}')">Reset</button></div>`;}
  else if(type==='schedule-meeting'){c=`<div class="mt">Schedule Meeting</div>
    <div class="fg2">
      <div class="fg"><label class="fl">Account</label><select id="sm-co"><option value="">Select...</option>${S.accounts.map(a=>`<option value="${a.id}">${a.companyName}</option>`).join('')}</select></div>
      <div class="fg"><label class="fl">Meeting Date</label><input type="date" id="sm-date"></div>
      <div class="fg"><label class="fl">Connect Type</label><select id="sm-type">${(S.ddOptions.connectStage||[]).map(o=>`<option>${o}</option>`).join('')}</select></div>
      <div class="fg"><label class="fl">Partner</label><select id="sm-pa">${S.users.filter(u=>u.role==='partner').map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div>
    </div>
    <div class="fg" style="margin-top:4px"><label class="fl">Notes</label><textarea id="sm-notes" placeholder="Agenda, attendees..."></textarea></div>
    <div class="ma"><button class="abtn-sm btn-ghost" onclick="closeM()">Cancel</button><button class="abtn abtn-orange" style="padding:7px 18px" onclick="closeM();sal('Meeting scheduled!','as')">Schedule</button></div>`;}
  return`<div class="mo" onclick="if(event.target===this)closeM()"><div class="mc">${c}</div></div>`;}

function openM(t,id=null){MODAL={type:t,id};R();}
function closeM(){MODAL=null;R();}
function selCS(el,val){document.querySelectorAll('.csp').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');const h=document.getElementById('f-cs');if(h)h.value=val;}
function calcOD(val){const el=document.getElementById('od-disp');if(!el)return;const od=odD(val);el.textContent=val?(od>0?`+${od} days overdue`:'On track — not overdue'):'Enter next connect date';}

/* ===== SAVE FUNCTIONS ===== */
function saveAMUpdate(accId,existingAmId){
  const cs=document.getElementById('f-cs')?.value||'';
  const acd=document.getElementById('f-acd')?.value||'';
  const ncd=document.getElementById('f-ncd')?.value||'';
  const ai=document.getElementById('f-ai')?.value||'';
  const acc=S.accounts.find(a=>a.id===accId);
  if(!acd&&!ncd)return sal('Please enter at least one date','ae');
  const entry={id:existingAmId||uid(),accountId:accId,partnerId:CU.id,connectStage:cs,actionItem:ai,connectDateDM:acd,nextConnectDateDM:ncd,updatedAt:today()};
  if(existingAmId){const i=S.amUpdates.findIndex(a=>a.id===existingAmId);if(i>-1)S.amUpdates[i]=entry;else S.amUpdates.push(entry);}
  else S.amUpdates.push(entry);
  S.auditLog.unshift({ts:new Date().toLocaleString('en-IN'),user:CU.name,role:CU.role,action:'Updated AM Connect',record:acc?.companyName||accId,field:'amConnect',oldv:'',newv:cs});
  sal('AM Connect saved successfully!','as');
}
function saveAccount(id){
  const cname=(document.getElementById('fa-cname')?.value||'').trim();
  if(!cname)return sal('Company name is required','ae');
  const acc={
    id:id||uid(),
    companyName:cname,companyEmail:document.getElementById('fa-cemail')?.value||'',
    focusArea:document.getElementById('fa-focus')?.value||'',
    accountGroup:document.getElementById('fa-group')?.value||'',
    programManager:document.getElementById('fa-pm')?.value||'',
    companyType:document.getElementById('fa-ctype')?.value||'',
    accountPriority:document.getElementById('fa-priority')?.value||'',
    opportunityCategory:document.getElementById('fa-ocat')?.value||'',
    crop:document.getElementById('fa-crop')?.value||'',
    stageId:document.getElementById('fa-stage')?.value||'',
    overallStatus:document.getElementById('fa-status')?.value||'yellow',
    assignedPartnerId:document.getElementById('fa-partner')?.value||'',
    trials:{
      stage:document.getElementById('fa-tstage')?.value||'',
      status:document.getElementById('fa-tstatus')?.value||'yellow',
      connectDate:document.getElementById('fa-tcd')?.value||'',
      agriManager:document.getElementById('fa-agrimgr')?.value||'',
      remarks:document.getElementById('fa-remarks')?.value||'',
    },
    createdAt:id?(S.accounts.find(a=>a.id===id)?.createdAt||today()):today(),
    updatedAt:today()
  };
  if(id){const i=S.accounts.findIndex(a=>a.id===id);if(i>-1)S.accounts[i]=acc;}else S.accounts.push(acc);
  S.auditLog.unshift({ts:new Date().toLocaleString('en-IN'),user:CU.name,role:CU.role,action:id?'Updated account record':'Created account record',record:cname,field:'overview',oldv:'',newv:'saved'});
  window._adminSelAcc=acc.id;
  sal(id?'Account record updated!':'Account record created!','as');
}
function deleteAccount(id){
  const acc=S.accounts.find(a=>a.id===id);
  S.accounts=S.accounts.filter(a=>a.id!==id);
  S.amUpdates=S.amUpdates.filter(a=>a.accountId!==id);
  window._adminSelAcc=null;
  sal(`Account "${acc?.companyName||id}" deleted`,'as');
}
function approveP(id){const p=S.pendingSignups.find(x=>x.id===id);if(!p)return;S.users.push({id:uid(),name:p.name,email:p.email,password:p.password,role:'partner',status:'active',createdAt:today()});S.pendingSignups=S.pendingSignups.filter(x=>x.id!==id);sal(`${p.name} approved!`,'as');}
function rejectP(id){const p=S.pendingSignups.find(x=>x.id===id);S.pendingSignups=S.pendingSignups.filter(x=>x.id!==id);sal(`${p?.name||'Request'} rejected`,'as');}
function adminRPw(id){const np=document.getElementById('mnp')?.value||'',cp=document.getElementById('mcp')?.value||'';if(np.length<8)return sal('Min 8 chars','ae');if(np!==cp)return sal('Passwords do not match','ae');const u=S.users.find(x=>x.id===id);if(u)u.password=np;closeM();sal('Password reset!','as');}
function saveProfile(){const n=(document.getElementById('men')?.value||'').trim(),e=(document.getElementById('mee')?.value||'').trim();if(!n||!e)return sal('Fields required','ae');if(S.users.find(u=>u.email===e&&u.id!==CU.id))return sal('Email in use','ae');CU.name=n;CU.email=e;const u=S.users.find(x=>x.id===CU.id);if(u){u.name=n;u.email=e;}sal('Profile updated!','as');}
function changePw(){const cur=document.getElementById('mec')?.value||'',np=document.getElementById('men2')?.value||'',cp=document.getElementById('mecf')?.value||'';if(cur!==CU.password)return sal('Current password incorrect','ae');if(np.length<8)return sal('Min 8 chars','ae');if(np!==cp)return sal('Passwords do not match','ae');CU.password=np;const u=S.users.find(x=>x.id===CU.id);if(u)u.password=np;sal('Password updated!','as');}
function savePartner(id){const n=(document.getElementById('mn')?.value||'').trim(),e=(document.getElementById('me')?.value||'').trim(),p=id?null:(document.getElementById('mp')?.value||'');if(!n||!e||(!id&&!p))return sal('Fields required','ae');if(!id&&p.length<8)return sal('Min 8 chars','ae');if(id){const u=S.users.find(x=>x.id===id);if(u){u.name=n;u.email=e;}}else{if(S.users.find(u=>u.email===e))return sal('Email in use','ae');S.users.push({id:uid(),name:n,email:e,password:p,role:'partner',status:'active',createdAt:today()});}closeM();sal('Partner saved!','as');}
function delPartner(id){if(id===CU.id)return sal("Can't remove yourself",'ae');S.users=S.users.filter(u=>u.id!==id);sal('Partner removed','as');}
function saveAdmin(id){const n=(document.getElementById('mn')?.value||'').trim(),e=(document.getElementById('me')?.value||'').trim(),p=id?null:(document.getElementById('mp')?.value||'');if(!n||!e||(!id&&!p))return sal('Fields required','ae');if(!id&&p.length<8)return sal('Min 8 chars','ae');if(id){const u=S.users.find(x=>x.id===id);if(u){u.name=n;u.email=e;}}else{if(S.users.find(u=>u.email===e))return sal('Email in use','ae');S.users.push({id:uid(),name:n,email:e,password:p,role:'admin',status:'active',createdAt:today()});}closeM();sal('Admin saved!','as');}
function delAdmin(id){if(id===CU.id)return sal("Can't remove yourself",'ae');S.users=S.users.filter(u=>u.id!==id);sal('Admin removed','as');}
function saveStage(id){const n=(document.getElementById('mn')?.value||'').trim();if(!n)return sal('Stage name required','ae');if(id){const s=S.stages.find(x=>x.id===id);if(s)s.name=n;}else S.stages.push({id:uid(),name:n});closeM();sal('Stage saved!','as');}
function delStage(id){S.stages=S.stages.filter(s=>s.id!==id);sal('Stage deleted','as');}
function addDD(key){const inp=document.getElementById(`dd-${key}`);if(!inp?.value.trim())return;if(!S.ddOptions[key])S.ddOptions[key]=[];if(!S.ddOptions[key].includes(inp.value.trim()))S.ddOptions[key].push(inp.value.trim());inp.value='';sal('Option added!','as');}
function removeDD(key,i){S.ddOptions[key].splice(i,1);sal('Option removed','as');}

R();
</script>
